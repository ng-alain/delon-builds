<ng-template #con>
  <ng-content />
</ng-template>
<ng-template #btnTpl>
  @if (button() !== 'none') {
    @let btnRender = _btn.render;
    @if (btnRender) {
      <nz-form-item [class]="btnRender.class!" class="sf-btns" [fixed-label]="btnRender.spanLabelFixed!">
        <div
          nz-col
          class="ant-form-item-control"
          [nzSpan]="btnGrid.span"
          [nzOffset]="btnGrid.offset"
          [nzXs]="btnGrid.xs"
          [nzSm]="btnGrid.sm"
          [nzMd]="btnGrid.md"
          [nzLg]="btnGrid.lg"
          [nzXl]="btnGrid.xl"
          [nzXXl]="btnGrid.xxl"
        >
          <div class="ant-form-item-control-input">
            <div class="ant-form-item-control-input-content">
              @if (button()) {
                <button
                  type="submit"
                  nz-button
                  data-type="submit"
                  [nzType]="_btn.submit_type!"
                  [nzSize]="btnRender.size!"
                  [nzLoading]="loading()"
                  [disabled]="liveValidate() && !valid"
                >
                  @if (_btn.submit_icon) {
                    <nz-icon
                      [nzType]="_btn.submit_icon.type!"
                      [nzTheme]="_btn.submit_icon.theme!"
                      [nzTwotoneColor]="_btn.submit_icon.twoToneColor!"
                      [nzIconfont]="_btn.submit_icon.iconfont!"
                    />
                  }
                  {{ _btn.submit }}
                </button>
                @if (_btn.reset) {
                  <button
                    type="button"
                    nz-button
                    data-type="reset"
                    [nzType]="_btn.reset_type!"
                    [nzSize]="btnRender.size!"
                    [disabled]="loading()"
                    (click)="reset(true)"
                  >
                    @let resetIcon = _btn.reset_icon;
                    @if (resetIcon) {
                      <nz-icon
                        [nzType]="resetIcon.type!"
                        [nzTheme]="resetIcon.theme!"
                        [nzTwotoneColor]="resetIcon.twoToneColor!"
                        [nzIconfont]="resetIcon.iconfont!"
                      />
                    }
                    {{ _btn.reset }}
                  </button>
                }
                @if (expandable() && _hasCollapse()) {
                  <button
                    type="button"
                    nz-button
                    nzType="text"
                    data-type="expand"
                    [attr.aria-expanded]="expanded()"
                    (click)="expanded.update(v => !v)"
                  >
                    {{ expanded() ? locale.collapse : locale.expand }}
                  </button>
                }
              } @else {
                <ng-template [ngTemplateOutlet]="con" />
              }
            </div>
          </div>
        </div>
      </nz-form-item>
    }
  } @else {
    <ng-template [ngTemplateOutlet]="con" />
  }
</ng-template>
<form
  nz-form
  ngNoForm
  novalidate
  [nzLayout]="layout()"
  (submit)="onSubmit($event)"
  [attr.autocomplete]="autocomplete()"
>
  @if (rootProperty) {
    <sf-item [formProperty]="rootProperty" [footer]="btnTpl" />
  }
</form>
